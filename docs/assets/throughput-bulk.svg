    <text x="29" y="69" fill="#b7c7d6" font-size="16">Repeated phrases · ~32 KiB per call</text>
    <rect x="486" y="35" width="12" height="12" rx="3" fill="#64e9db"/>
    <text x="506" y="46" fill="#f6f9fc" font-size="16">text-transliterate</text>
    <rect x="667" y="35" width="12" height="12" rx="3" fill="#ffa872"/>
    <text x="687" y="46" fill="#f6f9fc" font-size="16">AnyAscii</text>
