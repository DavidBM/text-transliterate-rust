<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" role="img" aria-labelledby="title desc">
  <title id="title">Short-phrase throughput</title>
  <desc id="desc">Paired bars for five samples with identical ASCII output, measured in decimal megabytes of input per second.</desc>
